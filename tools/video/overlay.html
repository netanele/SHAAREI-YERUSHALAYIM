<!doctype html>
<!-- Text layers for the catalog video. Designed at 720x1280 CSS px;
     rendered at device scale 1 (720p, WhatsApp) or 1.5 (1080p, full quality).
     Large, bold type and thick lines so the text survives WhatsApp compression. -->
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@600;700&family=Cinzel:wght@600&family=Frank+Ruhl+Libre:wght@500;700;900&display=block">
<style>
:root{--velvet-2:#14244a;--velvet-3:#1f3263;--gold:#d4ac5e;--gold-hi:#f0d89c;--ivory:#fbf6ea;--ivory-soft:#d6d9e2;--line:rgba(212,172,94,.75)}
html,body{margin:0;width:720px;height:1280px;background:transparent;overflow:hidden}
body{font-family:'Frank Ruhl Libre',serif;color:var(--ivory);-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0}
.topshade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(8,15,34,.7) 0%,rgba(8,15,34,.3) 8%,transparent 14%)}
.brand{position:absolute;top:54px;left:0;right:0;display:flex;justify-content:center;align-items:center;gap:12px;color:var(--gold-hi);font-weight:700;font-size:32px}
.brand svg{width:28px;height:32px}
.botshade{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,15,34,.97) 0%,rgba(8,15,34,.93) 30%,rgba(8,15,34,.55) 46%,transparent 58%)}
.txt{position:absolute;left:44px;right:44px;bottom:110px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px}
.kicker{font-family:'Frank Ruhl Libre',serif;font-weight:700;font-size:27px;color:var(--gold);letter-spacing:.06em}
.title{font-weight:700;font-size:58px;line-height:1.12;color:var(--gold-hi);margin:0;text-wrap:balance;text-shadow:0 2px 10px rgba(0,0,0,.35)}
.orn{width:150px;height:14px;color:var(--gold)}
.body{font-weight:500;font-size:34px;line-height:1.5;margin:0;color:var(--ivory);text-wrap:pretty;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.covshade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(8,15,34,.93) 0%,rgba(8,15,34,.7) 24%,rgba(8,15,34,.2) 40%,transparent 50%)}
.cov{position:absolute;top:92px;left:36px;right:36px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px;color:var(--gold-hi)}
.cov svg.emb{width:66px;height:74px}
.nhe{font-weight:900;font-size:104px;line-height:1;margin:0;white-space:nowrap;background:linear-gradient(180deg,#fbeec5,#dcb76a 55%,#c19846);-webkit-background-clip:text;background-clip:text;color:transparent}
.nlat{font-family:'Cinzel',serif;font-weight:600;font-size:32px;letter-spacing:.16em;margin:0;color:var(--gold-hi)}
.rule{width:200px;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.tag{font-weight:500;font-size:40px;margin:0;color:var(--ivory);text-shadow:0 2px 8px rgba(0,0,0,.4)}
.navy{position:absolute;inset:0;background:var(--velvet-2)}
.frame{position:absolute;inset:44px;border:3px solid var(--line);border-radius:50% 50% 6px 6px / 170px 170px 6px 6px}
.ct{position:absolute;inset:44px;padding:200px 50px 80px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:24px}
.ct svg.emb{width:84px;height:94px;color:var(--gold)}
.ct .title{font-size:86px}
.line{font-weight:500;font-size:37px;margin:0;color:var(--ivory)}
.who{font-weight:500;font-size:37px;color:var(--ivory-soft);margin:0}
.who b{color:var(--ivory);font-weight:700}
.num{font-family:'Assistant',sans-serif;font-weight:700;font-size:44px;color:var(--gold-hi);direction:ltr;unicode-bidi:isolate;margin:0}
.small{font-family:'Assistant',sans-serif;font-weight:600;font-size:24px;color:var(--ivory-soft);margin:0}
.link{font-family:'Assistant',sans-serif;font-weight:700;font-size:25px;color:var(--ivory);direction:ltr;unicode-bidi:isolate;margin:0;padding:10px 22px;border:3px solid var(--line);border-radius:999px}
.fdn{font-family:'Cinzel',serif;font-weight:600;font-size:19px;letter-spacing:.08em;white-space:nowrap;color:var(--gold-hi);margin:0;direction:ltr}
.spacer{flex:1}
</style></head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="emb" viewBox="0 0 64 72">
    <path d="M10 66V30a22 22 0 0 1 44 0v36" fill="none" stroke="currentColor" stroke-width="3.2"/>
    <path d="M18.5 66V31.5a13.5 13.5 0 0 1 27 0V66" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <path d="M28.5 3.5h7l-1.4 7.2h-4.2z" fill="currentColor"/>
    <path d="M4 66.5h56M7.5 70.5h49" fill="none" stroke="currentColor" stroke-width="2.2"/>
    <path d="M32 39l3.5 5.5-3.5 5.5-3.5-5.5z" fill="currentColor"/>
  </symbol>
  <symbol id="orn" viewBox="0 0 150 14">
    <path d="M0 7h58M92 7h58" stroke="currentColor" stroke-width="2.4"/>
    <path d="M75 0.5l6.5 6.5-6.5 6.5-6.5-6.5z" fill="currentColor"/>
  </symbol>
</svg>
<div id="root"></div>
<script>
const S = {
 sanctuary:{k:"תפילה",t:"בית הכנסת המרכזי",b:"לב הפרויקט יהיה היכל תפילה מרומם ומכובד, המשלב את יופייה של ירושלים עם קדושה, אחדות והכנסת אורחים."},
 dome:{k:"תפילה",t:"סיפורי התורה בכיפת ההיכל",b:"כיפת ההיכל תעוטר בציורים אמנותיים ומכובדים מסיפורי התורה, ובהם בריאת העולם, תיבת נח, אברהם אבינו, סולם יעקב, קריעת ים סוף, מתן תורה והמסע במדבר, סביב לוסטר מרכזי מפואר."},
 ark:{k:"תפילה",t:"ארון הקודש וספרי התורה",b:"ארון קודש מפואר ומעוגל יציג מספר רב של ספרי תורה מהודרים, המסודרים בחצי עיגול סביב ספר מרכזי ובכבוד הראוי."},
 kollel:{k:"תורה",t:"בית המדרש והכולל",b:"בית מדרש עשיר בספרים ושולחנות לימוד ישמש את אברכי הכולל ללימוד תורה בעיון, בחברותא ובשיעורים. בצדי האולם יוצבו עמדות מחשב צנועות לחיפוש מקורות תורניים ולעיון במאגרים דיגיטליים."},
 donors:{k:"שותפות",t:"הוקרה לתורמים",b:"קיר הוקרה מכובד יוקדש לשמות התורמים והשותפים בהקמת הבית, כביטוי להכרת הטוב ולשותפות בבניין בית של תורה וחסד לדורות."}
};
const emb = c => `<svg class="${c||''}" viewBox="0 0 64 72"><use href="#emb"/></svg>`;
const orn = `<svg class="orn" viewBox="0 0 150 14"><use href="#orn"/></svg>`;
const id = location.hash.slice(1);
let h = "";
if (id === "cover") {
  h = `<div class="scene"><div class="covshade"></div>
    <div class="cov">${emb("emb")}<h1 class="nhe">שערי ירושלים</h1><p class="nlat" lang="en">SHAAREI YERUSHALAYIM</p><span class="rule"></span><p class="tag">בית של תורה, תפילה, חסד ואחדות</p></div></div>`;
} else if (id === "contact") {
  h = `<div class="scene navy"><div class="frame"></div><div class="ct">${emb("emb")}
    <h2 class="title">יחד נבנה</h2>${orn}
    <p class="line">שותפות בהקמה, הקדשות ותרומות</p>
    <span class="spacer"></span>
    <p class="who">ליצירת קשר: <b>מרק אלבז</b></p>
    <p class="num">WhatsApp +1 786 909 0999</p>
    <p class="small">לצפייה בקטלוג המלא</p>
    <p class="link">netanele.github.io/SHAAREI-YERUSHALAYIM</p>
    <span class="spacer"></span>
    <p class="fdn">SHAAREI YERUSHALAYIM FOUNDATION, INC.</p>
    <p class="small">כל התמונות הן הדמיות רעיוניות של פרויקט מתוכנן.</p></div></div>`;
} else {
  const d = S[id];
  h = `<div class="scene"><div class="topshade"></div><div class="brand">${emb()}<span>שערי ירושלים</span></div><div class="botshade"></div>
    <div class="txt"><div class="kicker">${d.k}</div><h2 class="title">${d.t}</h2>${orn}<p class="body">${d.b}</p></div></div>`;
}
document.getElementById("root").innerHTML = h;
document.fonts.ready.then(() => document.body.dataset.ready = "1");
</script>
</body></html>
