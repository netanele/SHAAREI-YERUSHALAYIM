<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Frank+Ruhl+Libre:wght@500;900&display=block">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#0c172e}
.bg{position:absolute;inset:0;background:url(../../docs/img/exterior.jpg) center 46%/cover no-repeat}

.he{font-family:'Frank Ruhl Libre',serif;font-weight:900;font-size:104px;line-height:1;margin:0;
  background:linear-gradient(180deg,#f8e9bb,#d6b064 55%,#b98f3f);-webkit-background-clip:text;background-clip:text;color:transparent}
.lat{font-family:'Cinzel',serif;font-weight:600;font-size:30px;letter-spacing:.22em;color:#ecd395;margin:0}
.tag{font-family:'Frank Ruhl Libre',serif;font-weight:500;font-size:32px;color:#f6f0e2;margin:4px 0 0}
</style></head>
<body><div class="bg"></div><div class="shade"></div>
<div class="t"><h1 class="he">שערי ירושלים</h1><p class="lat">SHAAREI YERUSHALAYIM</p><p class="tag">בית של תורה, תפילה, חסד ואחדות</p></div>
<script>document.fonts.ready.then(()=>document.body.dataset.ready="1")</script>
